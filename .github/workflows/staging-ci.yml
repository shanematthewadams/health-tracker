name: Staging CI

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run safety tests
        run: npm test
      - name: Build staging bundle
        env:
          VITE_SUPABASE_URL: https://with-ci.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-publishable-validation-only
        run: npm run build
