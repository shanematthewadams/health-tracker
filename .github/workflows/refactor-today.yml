name: One-time Today tab refactor

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Refactor Today
        run: python scripts/refactor_today.py

      - name: Commit refactor
        run: |
          git config user.name "With Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Extract Today tab from Tracker"
          git push origin staging
