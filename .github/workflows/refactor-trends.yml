name: One-time Trends tab refactor

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/refactor-trends.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Refactor Trends
        run: python scripts/refactor_trends.py

      - name: Commit refactor
        run: |
          git config user.name "With Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Extract Trends tab from Tracker"
          git push origin staging
