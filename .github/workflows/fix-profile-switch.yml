name: Fix Profile switch
on:
  push:
    paths:
      - 'scripts/fix-profile-switch.py'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix-profile-switch.py
      - run: |
          rm scripts/fix-profile-switch.py
          rm .github/workflows/fix-profile-switch.yml
          git config user.name "With Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix Profile person switching behavior"
          git push origin staging
