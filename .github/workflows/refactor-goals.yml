name: One-time Goals tab refactor

on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Refactor Goals
        run: python scripts/refactor_goals.py

      - name: Commit refactor
        run: |
          git config user.name "With Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Extract Goals tab from Tracker"
          git push origin staging
