name: Phase 1 staging smoke

on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/phase1-staging-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build exact staging commit
        run: |
          npm ci
          npm run build
      - name: Confirm Netlify staging serves this build
        shell: bash
        run: |
          set -euo pipefail
          expected=$(grep -oE '/assets/index-[^"[:space:]]+\.js' dist/index.html | head -1)
          if [ -z "$expected" ]; then
            echo "Could not identify the built JS asset from dist/index.html"
            exit 1
          fi

          echo "Expecting staging to serve $expected"
          for attempt in $(seq 1 24); do
            if curl -fsSL --max-time 15 https://staging--health-tracker.netlify.app/ -o /tmp/staging.html; then
              if grep -Fq "$expected" /tmp/staging.html; then
                echo "Netlify staging matches this commit."
                exit 0
              fi
              echo "Staging is reachable but still serving an older build (attempt $attempt/24)."
            else
              echo "Staging is not reachable yet (attempt $attempt/24)."
            fi
            sleep 5
          done

          echo "Netlify staging did not converge to this commit."
          exit 1
